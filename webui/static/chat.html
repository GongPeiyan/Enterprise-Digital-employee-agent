<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数字员工 · 企业 AI 工作台</title>
<script>
  // 尽早应用主题，避免刷新闪白
  try { document.documentElement.dataset.theme = localStorage.getItem("theme") || "light"; } catch (e) {}
</script>
<style>
/* ============================================================
   设计令牌（参考 Vercel 的"阴影当边框 + 极简留白"与 Linear 的排版纪律）
   默认浅色：白底 + 近黑字 + 单一强调蓝；深色为可选主题
   ============================================================ */
:root{
  --bg:#ffffff; --bg-subtle:#fafafa; --bg-muted:#f4f4f5; --bg-hover:#f4f4f5;
  --fg:#171717; --fg-2:#4d4d4d; --fg-3:#6b6b6b; --fg-4:#8f8f8f;
  --border:#ebebeb; --border-2:#e0e0e0;
  --accent:#0a72ef; --accent-hover:#0964d3; --accent-soft:#ebf5ff; --accent-fg:#0068d6;
  --ok:#0f7b3f; --ok-soft:#e9f7ef; --warn:#b45309; --warn-soft:#fef6e7; --danger:#c0392b; --danger-soft:#fdecea;
  --ring:0 0 0 1px rgba(0,0,0,.08);
  --shadow-card:0 0 0 1px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
  --shadow-pop:0 0 0 1px rgba(0,0,0,.08), 0 12px 32px -12px rgba(0,0,0,.18);
  --r-sm:6px; --r-md:8px; --r-lg:12px; --r-pill:999px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC","Noto Sans CJK SC",sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"Sarasa Mono SC",Menlo,monospace;
}
html[data-theme="dark"]{
  --bg:#08090a; --bg-subtle:#0f1011; --bg-muted:#191a1b; --bg-hover:#1c1d1f;
  --fg:#f7f8f8; --fg-2:#d0d6e0; --fg-3:#98a0aa; --fg-4:#71767e;
  --border:rgba(255,255,255,.09); --border-2:rgba(255,255,255,.14);
  --accent:#4c9aff; --accent-hover:#6bb0ff; --accent-soft:rgba(76,154,255,.14); --accent-fg:#8cc2ff;
  --ok:#34d399; --ok-soft:rgba(52,211,153,.13); --warn:#fbbf24; --warn-soft:rgba(251,191,36,.12);
  --danger:#f87171; --danger-soft:rgba(248,113,113,.13);
  --ring:0 0 0 1px rgba(255,255,255,.09);
  --shadow-card:0 0 0 1px rgba(255,255,255,.09);
  --shadow-pop:0 0 0 1px rgba(255,255,255,.1), 0 16px 40px -16px rgba(0,0,0,.7);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font); background:var(--bg); color:var(--fg);
  font-size:15px; line-height:1.65; -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:inherit;cursor:pointer;background:none;border:none;color:inherit}
::selection{background:var(--accent-soft)}
/* 滚动条 */
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:var(--border-2);border:3px solid transparent;background-clip:content-box;border-radius:99px}
*::-webkit-scrollbar-thumb:hover{background:var(--fg-4);background-clip:content-box}
*::-webkit-scrollbar-track{background:transparent}

.app{display:flex;height:100vh;overflow:hidden}

/* ---------------- 左侧：品牌 + 专家角色 ---------------- */
.sidebar{
  width:252px;flex:0 0 252px;background:var(--bg-subtle);
  border-right:1px solid var(--border-2);display:flex;flex-direction:column;min-height:0;
}
.brand{display:flex;align-items:center;gap:10px;padding:18px 16px 14px}
.brand-mark{
  width:32px;height:32px;flex:0 0 32px;border-radius:var(--r-md);background:var(--fg);color:var(--bg);
  display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;letter-spacing:0;
}
.brand-name{font-size:14px;font-weight:600;letter-spacing:.2px}
.brand-sub{font-size:11.5px;color:var(--fg-3);line-height:1.4;margin-top:1px}
.nav-label{padding:10px 18px 6px;font-size:11.5px;color:var(--fg-4);font-weight:500;letter-spacing:.6px}
#roleList{flex:1;overflow-y:auto;padding:0 8px 8px;min-height:0}
.agent{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:8px 10px;border-radius:var(--r-md);color:var(--fg-2);
  transition:background .12s ease;
}
.agent:hover{background:var(--bg-hover)}
.agent.active{background:var(--bg);box-shadow:inset 3px 0 0 var(--accent),var(--ring);color:var(--fg)}
.agent.active .avatar{background:var(--accent);color:#fff}
/* 角色徽标配色（低饱和，避免花哨） */
.agent[data-role="管家"] .avatar{background:#eef2f7;color:#3d5a80}
.agent[data-role="妙妙"] .avatar{background:#eef4fb;color:#1f5f99}
.agent[data-role="准准"] .avatar{background:#eef7f1;color:#2f6b46}
.agent[data-role="码码"] .avatar{background:#f2f0fb;color:#4b3f9e}
.agent[data-role="图图"] .avatar{background:#fbf3ef;color:#8a4f2d}
.agent[data-role="采采"] .avatar{background:#f7f2ea;color:#7a5a22}
.agent[data-role="安安"] .avatar{background:#fdf0f2;color:#93374a}
.agent[data-role="顺顺"] .avatar{background:#edf5f5;color:#2c6167}
html[data-theme="dark"] .agent[data-role="管家"] .avatar{background:rgba(160,180,205,.16);color:#b9c8db}
html[data-theme="dark"] .agent[data-role="妙妙"] .avatar{background:rgba(120,175,225,.16);color:#9dc6ea}
html[data-theme="dark"] .agent[data-role="准准"] .avatar{background:rgba(110,200,150,.16);color:#96d6b4}
html[data-theme="dark"] .agent[data-role="码码"] .avatar{background:rgba(160,150,240,.18);color:#bdb6f5}
html[data-theme="dark"] .agent[data-role="图图"] .avatar{background:rgba(225,150,110,.18);color:#e8b295}
html[data-theme="dark"] .agent[data-role="采采"] .avatar{background:rgba(215,185,110,.18);color:#ddc48e}
html[data-theme="dark"] .agent[data-role="安安"] .avatar{background:rgba(235,130,150,.18);color:#eda1b1}
html[data-theme="dark"] .agent[data-role="顺顺"] .avatar{background:rgba(120,200,205,.16);color:#9fd3d7}

.avatar{
  width:28px;height:28px;flex:0 0 28px;border-radius:var(--r-md);
  display:flex;align-items:center;justify-content:center;
  font-size:12.5px;font-weight:600;letter-spacing:0;
  background:var(--bg-muted);color:var(--fg-2);border:none;
}
.agent .meta{min-width:0}
.agent .name{display:block;font-size:13.5px;font-weight:500;line-height:1.35}
.agent.active .name{font-weight:600;letter-spacing:0}
.agent .desc{display:block;font-size:11.5px;color:var(--fg-4);line-height:1.35;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar-foot{border-top:1px solid var(--border);padding:10px 14px;display:flex;align-items:center;
  justify-content:space-between;gap:8px}
.user-chip{display:flex;align-items:center;gap:8px;min-width:0}
.sidebar-foot .avatar{background:var(--fg);color:var(--bg);font-size:12px}
.user-chip .name{font-size:12.5px;font-weight:500;line-height:1.3}
.user-chip .desc{font-size:11px;color:var(--fg-4);line-height:1.3}

/* ---------------- 主区：顶栏 / 消息 / 输入 ---------------- */
main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.topbar{border-bottom:1px solid var(--border-2);background:var(--bg)}
.topbar-inner{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  max-width:820px;margin:0 auto;padding:12px 22px;
}
.titles h1{font-size:15px;font-weight:600;letter-spacing:-.1px}
.titles p{font-size:12px;color:var(--fg-3);margin-top:1px}
.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn{
  display:inline-flex;align-items:center;gap:6px;
  height:30px;padding:0 11px;border-radius:var(--r-sm);
  font-size:12.5px;font-weight:500;color:var(--fg-2);
  background:var(--bg);box-shadow:var(--ring);transition:background .12s,color .12s;
}
.btn:hover{background:var(--bg-muted);color:var(--fg)}
.btn.primary{background:var(--accent);color:#fff;box-shadow:none}
.btn.primary:hover{background:var(--accent-hover);color:#fff}
.btn.ghost{background:transparent;box-shadow:none;color:var(--fg-2)}
.btn.ghost:hover{background:var(--bg-muted)}
.btn.icon{width:30px;padding:0;justify-content:center}
.status{
  display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;
  border-radius:var(--r-pill);background:var(--bg-muted);color:var(--fg-3);
  font-size:11.5px;font-variant-numeric:tabular-nums;white-space:nowrap;
}
.status.warn{background:var(--warn-soft);color:var(--warn)}
.status.err{background:var(--danger-soft);color:var(--danger)}
.status .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.75}
.sep{width:1px;height:18px;background:var(--border-2);margin:0 2px}

/* 下滑面板（资料 / 花名表 / 知识审核） */
.panel{padding:14px 22px;background:var(--bg-subtle);border-bottom:1px solid var(--border);
  font-size:13px;color:var(--fg-2)}
.panel .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inp{
  height:32px;padding:0 10px;border-radius:var(--r-sm);background:var(--bg);color:var(--fg);
  border:none;box-shadow:var(--ring);font-size:13px;font-family:inherit;
}
.inp:focus{outline:2px solid var(--accent);outline-offset:-1px}
#fileList,#rosterList,#knowledgeList{margin-top:10px}
#fileList a{display:flex;justify-content:space-between;gap:12px;padding:7px 10px;margin-bottom:4px;
  border-radius:var(--r-sm);background:var(--bg);box-shadow:var(--ring);color:var(--fg);text-decoration:none;font-size:12.5px}
#fileList a:hover{background:var(--bg-muted)}
#fileList a span.size{color:var(--fg-4);font-variant-numeric:tabular-nums}
.k-item{padding:12px 14px;margin-bottom:8px;border-radius:var(--r-md);background:var(--bg);box-shadow:var(--ring)}
.k-item .q{font-size:13px;font-weight:600;color:var(--fg)}
.k-item .a{margin:6px 0 10px;font-size:12.5px;color:var(--fg-2);white-space:pre-wrap}
.k-item .acts{display:flex;gap:8px}
.roster-row{display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:7px 10px;margin-bottom:4px;border-radius:var(--r-sm);background:var(--bg);box-shadow:var(--ring)}
.roster-row .id{font-family:var(--mono);font-size:12.5px;color:var(--fg-3);margin-right:10px}
.empty-tip{color:var(--fg-3);font-size:12.5px}

/* 消息区 */
.messages{flex:1;overflow-y:auto;padding:26px 22px 8px;scroll-behavior:smooth}
.messages>*{max-width:820px;margin-left:auto;margin-right:auto}
.empty{text-align:center;padding:56px 10px 24px}
.empty h2{font-size:19px;font-weight:600;letter-spacing:-.2px}
.empty p{margin-top:8px;font-size:13px;color:var(--fg-3)}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.chip{height:32px;padding:0 14px;border-radius:var(--r-pill);font-size:12.5px;color:var(--fg-2);
  background:var(--bg);box-shadow:var(--ring);transition:background .12s,color .12s}
.chip:hover{background:var(--bg-muted);color:var(--fg)}

.msg{display:flex;gap:12px;margin-bottom:24px;align-items:flex-start}
.msg .avatar{margin-top:1px}
.msg .body{min-width:0;flex:1}
.msg .who{font-size:12px;font-weight:600;color:var(--fg);margin-bottom:3px;display:flex;gap:8px;align-items:baseline}
.msg .who.me{justify-content:flex-end;font-weight:500;color:var(--fg-3)}
.msg .ts{font-size:11px;font-weight:400;color:var(--fg-4);font-variant-numeric:tabular-nums}
.msg .text{font-size:14.5px;line-height:1.75;color:var(--fg);white-space:pre-wrap;word-break:break-word}
.msg .md :first-child{margin-top:0}
.msg .md :last-child{margin-bottom:0}
.msg .md p{margin:0 0 10px}
.msg .md h1,.msg .md h2,.msg .md h3,.msg .md h4{font-weight:600;line-height:1.45;
  margin:16px 0 8px;letter-spacing:-.1px}
.msg .md h1{font-size:16px}.msg .md h2{font-size:15.5px}.msg .md h3{font-size:15px}.msg .md h4{font-size:14.5px}
.msg .md ul,.msg .md ol{margin:0 0 10px;padding-left:24px}
.msg .md ul{list-style:disc}.msg .md ol{list-style:decimal}
.msg .md li::marker{color:var(--fg-3)}
.msg .md li{margin:3px 0}
.msg .md code{font-family:var(--mono);font-size:12.5px;background:var(--bg-muted);
  padding:1px 5px;border-radius:4px}
.msg .md pre{margin:0 0 12px;padding:12px 14px;border-radius:var(--r-md);background:var(--bg-subtle);
  box-shadow:var(--ring);overflow:auto}
.msg .md pre code{background:none;padding:0;font-size:12.5px;line-height:1.7}
.msg .md blockquote{margin:0 0 10px;padding:2px 0 2px 12px;border-left:2px solid var(--border-2);color:var(--fg-2)}
.msg .md hr{border:none;border-top:1px solid var(--border);margin:14px 0}
.msg .md a{color:var(--accent);text-decoration:none}
.msg .md a:hover{text-decoration:underline}
.msg .md strong{font-weight:600}
.msg .md table{border-collapse:collapse;width:100%;margin:6px 0 12px;font-size:12.5px;
  font-variant-numeric:tabular-nums}
.msg .md th,.msg .md td{border:1px solid var(--border-2);padding:6px 10px;text-align:left;vertical-align:top;font-variant-numeric:tabular-nums}
.msg .md th{background:var(--bg-subtle);font-weight:600;white-space:nowrap}
.msg .md tbody tr:nth-child(even){background:#f7f7f7}
html[data-theme="dark"] .msg .md tbody tr:nth-child(even){background:rgba(255,255,255,.03)}
.msg .src{margin-top:9px;padding-top:8px;border-top:1px solid var(--border);
  font-size:11.5px;color:var(--fg-3);line-height:1.6}
.msg .tool,.msg .orchestrator{
  margin:8px 0;padding:6px 10px;border-radius:var(--r-sm);background:var(--bg-muted);
  font-size:11.5px;color:var(--fg-2);font-family:var(--mono);line-height:1.6
}
.msg .orchestrator{font-family:var(--font)}
.msg .pending{font-size:12.5px;color:var(--fg-3);display:flex;align-items:center;gap:8px}
.msg .pending::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);
  animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.3;transform:scale(.85)}50%{opacity:1;transform:scale(1)}}
.msg .dl{margin-top:10px}
.msg .dl a,.msg .dl button{
  display:inline-flex;align-items:center;height:28px;padding:0 11px;border-radius:var(--r-sm);
  font-size:12px;font-weight:500;color:var(--fg-2);background:var(--bg);box-shadow:var(--ring);text-decoration:none
}
.msg .dl a:hover,.msg .dl button:hover{background:var(--bg-muted);color:var(--fg)}
.msg.user{justify-content:flex-end}
.msg.user .body{flex:0 1 auto;display:flex;flex-direction:column;align-items:flex-end}
.msg.user .text{background:var(--bg-muted);border-radius:var(--r-lg);padding:9px 14px;max-width:560px}

/* 输入区 */
.composer{padding:10px 22px 18px;background:var(--bg)}
.composer-inner{max-width:820px;margin:0 auto;display:flex;gap:10px;align-items:flex-end;
  background:var(--bg);border-radius:var(--r-lg);box-shadow:var(--ring);padding:8px 8px 8px 14px;
  transition:box-shadow .15s}
.composer-inner:focus-within{box-shadow:0 0 0 1px var(--accent),0 0 0 4px var(--accent-soft)}
#input{
  flex:1;border:none;background:none;color:var(--fg);font-family:inherit;font-size:14.5px;
  line-height:1.6;resize:none;max-height:180px;padding:6px 0;outline:none
}
#input::placeholder{color:var(--fg-4)}
.composer .btn.primary{height:34px;padding:0 16px;border-radius:var(--r-md)}
.composer .btn.primary:disabled{background:var(--bg-muted);color:var(--fg-4);cursor:default}
.composer-hint{max-width:820px;margin:8px auto 0;font-size:11px;color:var(--fg-4);text-align:center}

@media (max-width:900px){
  .app{flex-direction:column}
  .sidebar{width:auto;flex:0 0 auto;flex-direction:row;align-items:center;overflow-x:auto;
    border-right:none;border-bottom:1px solid var(--border);padding:8px 10px;gap:6px}
  .brand,.nav-label,.sidebar-foot{display:none}
  #roleList{display:flex;gap:6px;padding:0;overflow:visible}
  .agent{width:auto;padding:6px 10px;white-space:nowrap}
  .agent .desc{display:none}
  .topbar-inner{padding:10px 14px}
  .titles p{display:none}
  .messages{padding:18px 14px 4px}
  .composer{padding:8px 14px 14px}
}
</style>
</head>
<body>
<div class="app">
  <!-- 左侧：品牌 + 专家角色 -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">数</div>
      <div>
        <div class="brand-name">数字员工</div>
        <div class="brand-sub">企业数字员工工作台</div>
      </div>
    </div>
    <div class="nav-label">专家角色</div>
    <nav id="roleList">
      <button class="agent" data-role="管家" onclick="switchRole('管家')"><span class="avatar">管</span><span class="meta"><span class="name">管家</span><span class="desc">复杂任务拆解与调度</span></span></button>
      <button class="agent active" data-role="妙妙" onclick="switchRole('妙妙')"><span class="avatar">妙</span><span class="meta"><span class="name">妙妙</span><span class="desc">文档 · 文案 · 标书</span></span></button>
      <button class="agent" data-role="准准" onclick="switchRole('准准')"><span class="avatar">准</span><span class="meta"><span class="name">准准</span><span class="desc">数据 · 报表 · 财务</span></span></button>
      <button class="agent" data-role="码码" onclick="switchRole('码码')"><span class="avatar">码</span><span class="meta"><span class="name">码码</span><span class="desc">代码 · 测试 · 发布</span></span></button>
      <button class="agent" data-role="图图" onclick="switchRole('图图')"><span class="avatar">图</span><span class="meta"><span class="name">图图</span><span class="desc">图纸 · 工艺 · BOM</span></span></button>
      <button class="agent" data-role="采采" onclick="switchRole('采采')"><span class="avatar">采</span><span class="meta"><span class="name">采采</span><span class="desc">物料 · 成本 · 合同</span></span></button>
      <button class="agent" data-role="安安" onclick="switchRole('安安')"><span class="avatar">安</span><span class="meta"><span class="name">安安</span><span class="desc">考勤 · 档案 · 制度答疑</span></span></button>
      <button class="agent" data-role="顺顺" onclick="switchRole('顺顺')"><span class="avatar">顺</span><span class="meta"><span class="name">顺顺</span><span class="desc">生产计划 · 工时</span></span></button>
    </nav>
    <div class="sidebar-foot">
      <div class="user-chip">
        <span class="avatar" id="userAvatar">员</span>
        <div>
          <div class="name" id="userName">已登录</div>
          <div class="desc" id="userRole">数字员工工作台</div>
        </div>
      </div>
      <button class="btn ghost" onclick="logout()">退出</button>
    </div>
  </aside>

  <main>
    <header class="topbar">
      <div class="topbar-inner">
      <div class="titles">
        <h1 id="currentRole">妙妙</h1>
        <p id="roleDesc">文档、文案、标书与会议纪要</p>
      </div>
      <div class="actions">
        <span class="status" id="kbStatus"><span class="dot"></span>知识库</span>
        <span class="sep"></span>
        <button class="btn" onclick="toggleFiles()" title="上传与查看个人文件">资料</button>
        <button class="btn" id="rosterBtn" style="display:none" onclick="toggleRoster()" title="管理员工工号">花名表</button>
        <button class="btn" id="knowledgeBtn" style="display:none" onclick="toggleKnowledge()" title="审核沉淀的知识">知识审核</button>
        <button class="btn" onclick="location.href='/skills'" title="共享提示词技能">技能库</button>
        <span class="sep"></span>
        <button class="btn ghost" onclick="rebuildIndex()" title="docs 目录有变化会自动重建，这里可手动触发">重建索引</button>
        <button class="btn icon" id="themeBtn" onclick="toggleTheme()" title="切换深浅色">◑</button>
      </div>
      </div>
    </header>

    <div id="filePanel" class="panel" style="display:none">
      <div class="row">
        <input type="file" id="fileInput" style="display:none" onchange="uploadFile()">
        <button class="btn" onclick="document.getElementById('fileInput').click()">上传文档</button>
        <span class="empty-tip">管理员上传的文档进入共享知识库；普通员工上传的只进个人知识库</span>
      </div>

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

/* 轻量 Markdown 渲染：支持 标题/加粗/斜体/行内代码/代码块/有序无序列表/引用/表格/分隔线。
   先整体转义再做结构替换，避免模型输出里的 HTML 被执行。 */
function renderMD(md) {
  const src = escapeHtml(md || "");
  const lines = src.split("\n");
  const inline = function (s) {
    return s
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[^*\w])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  };
  const out = [];
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (/^\s*```/.test(line)) {
      i++; const buf = [];
      while (i < lines.length && !/^\s*```/.test(lines[i])) { buf.push(lines[i]); i++; }
      i++;
      out.push("<pre><code>" + buf.join("\n") + "</code></pre>");
      continue;
    }
    if (/^\s*\|.*\|\s*$/.test(line) && i + 1 < lines.length && /^\s*\|[\s:\-|]+\|\s*$/.test(lines[i + 1])) {
      const cells = function (l) {
        return l.trim().replace(/^\||\|$/g, "").split("|").map(function (s) { return s.trim(); });
      };
      const head = cells(line);
      // 分隔行决定列对齐：|:---|---:|:---:| → 左/右/居中（金额、数字列右对齐才对得齐小数点）
      const align = cells(lines[i + 1]).map(function (s) {
        const l = s.charAt(0) === ":", r = s.charAt(s.length - 1) === ":";
        return (l && r) ? "center" : (r ? "right" : (l ? "left" : ""));
      });
      const tag = function (name, txt, idx) {
        const a = align[idx] || "";
        return "<" + name + (a ? ' style="text-align:' + a + '"' : "") + ">" + inline(txt) + "</" + name + ">";
      };
      i += 2; const rows = [];
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) { rows.push(cells(lines[i])); i++; }
      out.push("<table><thead><tr>" + head.map(function (h, idx) { return tag("th", h, idx); }).join("") +
        "</tr></thead><tbody>" + rows.map(function (r) {
          return "<tr>" + r.map(function (c, idx) { return tag("td", c, idx); }).join("") + "</tr>";
        }).join("") + "</tbody></table>");
      continue;
    }
    let m;
    if ((m = line.match(/^(#{1,4})\s+(.*)$/))) {
      const n = m[1].length;
      out.push("<h" + n + ">" + inline(m[2]) + "</h" + n + ">");
      i++; continue;
    }
    if (/^\s*([-*_])\1{2,}\s*$/.test(line)) { out.push("<hr>"); i++; continue; }
    if (/^\s*(&gt;|>)\s?/.test(line)) {
      const buf = [];
      while (i < lines.length && /^\s*(&gt;|>)\s?/.test(lines[i])) {
        buf.push(lines[i].replace(/^\s*(&gt;|>)\s?/, "")); i++;
      }
      out.push("<blockquote>" + inline(buf.join("<br>")) + "</blockquote>");
      continue;
    }
    if (/^\s*([-*+]|\d+\.)\s+/.test(line)) {
      const ordered = /^\s*\d+\./.test(line);
      const itemRe = ordered ? /^\s*\d+\.\s+/ : /^\s*[-*+]\s+/;
      const items = [];
      while (i < lines.length) {
        if (itemRe.test(lines[i])) {
          items.push("<li>" + inline(lines[i].replace(itemRe, "")) + "</li>");
          i++;
        } else if (!lines[i].trim() && i + 1 < lines.length && itemRe.test(lines[i + 1])) {
          i++;   // 列表项之间夹了空行：仍属同一个列表（否则每项都会重新从 1 编号）
        } else {
          break;
        }
      }
      out.push(ordered ? "<ol>" + items.join("") + "</ol>" : "<ul>" + items.join("") + "</ul>");
      continue;
    }
    if (!line.trim()) { i++; continue; }
    const buf = [line]; i++;
    while (i < lines.length && lines[i].trim() &&
           !/^(\s*([-*+]|\d+\.)\s+|#{1,4}\s|\s*```|\s*(&gt;|>)|\s*\|)/.test(lines[i])) {
      buf.push(lines[i]); i++;
    }
    out.push("<p>" + inline(buf.join("<br>")) + "</p>");
  }
  return out.join("");
}

async function loadHistory() {
  try {
    const r = await fetch("/api/history", { headers: { "Authorization": "Bearer " + token } });
    if (r.status === 401) { location.href = "/"; return; }
    const res = await r.json();
    if (res.ok && res.history) {
      for (const m of res.history) {
        addMsg(m.content, m.role === "user" ? "user" : "ai", undefined, true);
      }
    }
  } catch (e) {}
}
loadHistory();

function nowHM() {
  const d = new Date();
  return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}

function addMsg(text, who, sources, noTime) {
  const role = currentRole;
  clearEmptyState();
  const div = document.createElement("div");
  div.className = "msg " + who;
  div.dataset.role = role;

  const body = document.createElement("div");
  body.className = "body";
  if (who !== "user") {
    const whoEl = document.createElement("div");
    whoEl.className = "who";
    whoEl.textContent = role;
    if (!noTime) {
      const tm = document.createElement("span");
      tm.className = "ts";
      tm.textContent = nowHM();
      whoEl.appendChild(tm);
    }
    body.appendChild(whoEl);
  } else if (!noTime) {
    const meEl = document.createElement("div");
    meEl.className = "who me";
    const tm = document.createElement("span");
    tm.className = "ts";
    tm.textContent = nowHM();
    meEl.textContent = "我";
    meEl.appendChild(tm);
    body.appendChild(meEl);
  }
  const t = document.createElement("div");
  if (who === "user") {
    t.className = "text";
    t.textContent = text;
  } else {
    t.className = "text md";
    t.innerHTML = renderMD(text);
  }
  body.appendChild(t);

  if (sources && sources.length) {
    const s = document.createElement("div");
    s.className = "src";
    s.textContent = "来源：" + [...new Set(sources)].join("、");
    body.appendChild(s);
  }
  div.appendChild(body);
  const box = document.getElementById("messages");
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

async function send() {
  const input = document.getElementById("input");
  const q = input.value.trim();
  if (!q) return;
  addMsg(q, "user");
  input.value = "";
  input.style.height = "auto";

  const role = currentRole;
  const aiDiv = document.createElement("div");
  aiDiv.className = "msg ai";
  aiDiv.dataset.role = role;
  const body = document.createElement("div");
  body.className = "body";
  const whoEl = document.createElement("div");
  whoEl.className = "who";
  whoEl.textContent = role;
  const tsEl = document.createElement("span");
  tsEl.className = "ts";
  tsEl.textContent = nowHM();
  whoEl.appendChild(tsEl);
  const aiText = document.createElement("div");
  aiText.className = "text md";
  let aiRaw = "";
  const pending = document.createElement("div");
  pending.className = "pending";
  pending.textContent = "正在检索公司知识库…";
  body.appendChild(whoEl);
  body.appendChild(pending);
  body.appendChild(aiText);
  aiDiv.appendChild(body);
  document.getElementById("messages").appendChild(aiDiv);
  document.getElementById("messages").scrollTop = document.getElementById("messages").scrollHeight;

  let fullReply = "";
  let pendingGone = false;
  function dropPending() {
    if (!pendingGone) { pending.remove(); pendingGone = true; }
  }

  try {
    const r = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
      body: JSON.stringify({ message: q, role: role })
    });
    if (r.status === 401) { location.href = "/"; return; }

    const reader = r.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buffer.indexOf("\n\n")) !== -1) {
        const chunk = buffer.slice(0, idx);
        buffer = buffer.slice(idx + 2);
        if (chunk.startsWith("data: ")) {
          try {
            const data = JSON.parse(chunk.slice(6));
            if (data.tool) {
              dropPending();
              const t = document.createElement("div");
              t.className = "tool";
              t.textContent = "工具 " + data.tool + " → " + data.result;
              body.appendChild(t);
            }
            if (data.orchestrator) {
              dropPending();
              const o = document.createElement("div");
              o.className = "orchestrator";
              o.textContent = data.orchestrator;
              body.appendChild(o);
            }
            if (data.expert) {
              dropPending();
              const e = document.createElement("div");
              e.className = "orchestrator";
              e.textContent = "转交 " + data.expert + "：" + (data.sub || "");
              body.appendChild(e);
            }
            if (data.delta) {
              dropPending();
              fullReply += data.delta;
              aiRaw += data.delta;
              aiText.innerHTML = renderMD(aiRaw);
            }
            if (data.done && data.sources && data.sources.length) {
              const s = document.createElement("div");
              s.className = "src";
              s.textContent = "来源：" + [...new Set(data.sources)].join("、");
              body.appendChild(s);
            }
            if (data.done) {
              dropPending();
              if (data.role) switchRole(data.role);
              const dl = document.createElement("div");
              dl.className = "dl";
              const cp = document.createElement("button");
              cp.textContent = "复制";
              cp.onclick = function () {
                navigator.clipboard.writeText(fullReply).then(function () {
                  cp.textContent = "已复制"; setTimeout(function () { cp.textContent = "复制"; }, 1500);
                }).catch(function () { cp.textContent = "复制失败"; });
              };
              dl.appendChild(cp);
              if (data.doc) {
                const a = document.createElement("a");
                a.href = "/api/download/" + encodeURIComponent(data.doc) + "?token=" + token;
                a.textContent = "下载 Word 文档";
                dl.appendChild(a);
              } else {
                const b = document.createElement("button");
                b.textContent = "保存为 Word";
                b.onclick = function () { saveDoc(fullReply); };
                dl.appendChild(b);
              }
              body.appendChild(dl);
            }
          } catch (e) {}
        }
      }
      const box = document.getElementById("messages");
      box.scrollTop = box.scrollHeight;
    }
    dropPending();
  } catch (e) {
    dropPending();
    aiText.className = "text";
    aiText.textContent = "网络错误：" + e;
  }
}

function toggleFiles() {

  p.style.display = p.style.display === "none" ? "block" : "none";

  const res = await r.json();
  const list = document.getElementById("fileList");

    for (const f of res.files) {

      s.className = "size";

      a.appendChild(s);
      list.appendChild(a);

    list.innerHTML = '<span class="empty-tip">暂无文件</span>';
  }

// 管理员才显示"花名表""知识审核"
if (localStorage.getItem("is_admin") === "1") {
  document.getElementById("rosterBtn").style.display = "inline-flex";
  document.getElementById("knowledgeBtn").style.display = "inline-flex";
}

async function loadPendingKnowledge() {

  const res = await r.json();

      q.textContent = item.question;

async function approveKnowledge(id) {

  const r = await fetch("/api/roster/add", { method: "POST", headers: {"Content-Type":"application/json","Authorization":"Bearer "+token}, body: JSON.stringify({emp_id:id, name:name}) });
  const res = await r.json();

}

async function rosterRemove(id) {
  const r = await fetch("/api/roster/remove", { method: "POST", headers: {"Content-Type":"application/json","Authorization":"Bearer "+token}, body: JSON.stringify({emp_id:id}) });
  const res = await r.json();
  if (res.ok) loadRoster();
}

async function loadRoster() {
  const r = await fetch("/api/roster/list", { headers: {"Authorization":"Bearer "+token} });
  const res = await r.json();
  const list = document.getElementById("rosterList");
  list.innerHTML = "";
  if (res.roster && res.roster.length) {
    for (const row of res.roster) {
      const div = document.createElement("div");
      div.className = "roster-row";
      const span = document.createElement("span");
      const idSpan = document.createElement("span");
      idSpan.className = "id";
      idSpan.textContent = row.emp_id;
      span.appendChild(idSpan);
      span.appendChild(document.createTextNode(row.name));

async function saveDoc(content) {
  const title = prompt("输入文档标题（默认：文档）", "文档");
  if (title === null) return;
  const r = await fetch("/api/save_doc", { method:"POST", headers:{"Content-Type":"application/json","Authorization":"Bearer "+token}, body: JSON.stringify({title:title, content:content}) });
  const res = await r.json();
  if (res.ok) {
    window.open("/api/download/" + encodeURIComponent(res.filename) + "?token=" + token);
  } else {
    alert("生成失败：" + res.msg);
  }
}

// 输入框：随内容增高 + 空内容时发送按钮置灰
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
function syncSendBtn() {
  sendBtn.disabled = !inputEl.value.trim();
}
inputEl.addEventListener("input", function () {
  this.style.height = "auto";
  this.style.height = Math.min(this.scrollHeight, 180) + "px";
  syncSendBtn();
});
syncSendBtn();

// 知识库索引状态（丢文件进 docs/ 会自动重建，这里给可见反馈）
async function pollKbStatus() {
  const el = document.getElementById("kbStatus");
  try {
    const r = await fetch("/api/index_status");
    const d = await r.json();
    el.className = "status";
    if (d.rebuilding) {
      el.className = "status warn";
      el.innerHTML = '<span class="dot"></span>知识库重建中';
    } else if (d.last_error) {
      el.className = "status err";
      el.innerHTML = '<span class="dot"></span>重建失败 · 见日志';
    } else {
      el.innerHTML = '<span class="dot"></span>知识库 ' + d.chunks + " 条";
      el.title = "已收录 " + d.chunks + " 条知识片段，构建时间 " + (d.built_at || "-") + "；新增文档会自动更新";
    }
  } catch (e) {}
}

async function rebuildIndex() {
  if (!confirm("重建会重新读取 docs/ 下的全部资料并重新生成索引，通常需要几分钟。\n重建期间仍可正常提问，确定现在重建吗？")) return;
  const r = await fetch("/api/index/rebuild", { method: "POST", headers: { "Authorization": "Bearer " + token } });
  const res = await r.json();
  if (res.ok && res.started) alert("已开始重建，进度看顶部状态（重建期间仍可正常提问）");
  else if (res.ok) alert("已在重建中，不用重复触发");
  else alert("触发失败：" + (res.msg || r.status));
  pollKbStatus();
}

setInterval(pollKbStatus, 5000);
pollKbStatus();

function logout() {
  localStorage.removeItem("token");
  localStorage.removeItem("is_admin");
  localStorage.removeItem("emp_id");
  location.href = "/";
}
</script>
