<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · 数字员工</title>
<script>
  try { document.documentElement.dataset.theme = localStorage.getItem("theme") || "light"; } catch (e) {}
</script>
<style>
:root{
  --bg:#ffffff; --bg-subtle:#fafafa; --bg-muted:#f4f4f5;
  --fg:#171717; --fg-2:#4d4d4d; --fg-3:#7a7a7a; --fg-4:#a1a1a1;
  --border:#ebebeb; --border-2:#e0e0e0;
  --accent:#0a72ef; --accent-soft:#ebf5ff; --accent-fg:#0068d6;
  --ok:#0f7b3f; --danger:#c0392b;
  --ring:0 0 0 1px rgba(0,0,0,.08);
  --r-sm:6px; --r-md:8px; --r-lg:12px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC","Noto Sans CJK SC",sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"Sarasa Mono SC",monospace;
}
html[data-theme="dark"]{
  --bg:#08090a; --bg-subtle:#0f1011; --bg-muted:#191a1b;
  --fg:#f7f8f8; --fg-2:#d0d6e0; --fg-3:#8a8f98; --fg-4:#62666d;
  --border:rgba(255,255,255,.09); --border-2:rgba(255,255,255,.14);
  --accent:#4c9aff; --accent-soft:rgba(76,154,255,.14); --accent-fg:#8cc2ff;
  --ok:#34d399; --danger:#f87171;
  --ring:0 0 0 1px rgba(255,255,255,.09);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:var(--font);background:var(--bg);color:var(--fg);font-size:15px;line-height:1.6;
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  -webkit-font-smoothing:antialiased;
}
.container{width:100%;max-width:392px}
.brand{display:flex;align-items:center;gap:11px;padding-bottom:20px;margin-bottom:22px;border-bottom:1px solid var(--border)}
.brand-mark{width:34px;height:34px;border-radius:var(--r-md);background:var(--fg);color:var(--bg);
  display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600}
.brand-name{font-size:14.5px;font-weight:600}
.brand-sub{font-size:11.5px;color:var(--fg-3);line-height:1.4}
.card{background:var(--bg);border-radius:var(--r-lg);box-shadow:var(--ring);padding:26px 26px 22px}
.card h1{font-size:18px;font-weight:600;letter-spacing:-.2px}
.card .sub{margin:5px 0 20px;font-size:12.5px;color:var(--fg-3);line-height:1.6}
label{display:block;font-size:12px;font-weight:500;color:var(--fg-2);margin-bottom:6px}
.field{margin-bottom:14px}
input{
  width:100%;height:38px;padding:0 12px;border-radius:var(--r-sm);font-family:inherit;font-size:14px;
  background:var(--bg);color:var(--fg);border:none;box-shadow:var(--ring);outline:none;
}
input::placeholder{color:var(--fg-4)}
input:focus{box-shadow:0 0 0 1px var(--accent),0 0 0 4px var(--accent-soft)}
.btn{
  width:100%;height:38px;border-radius:var(--r-sm);font-family:inherit;font-size:14px;font-weight:500;
  cursor:pointer;border:none;display:flex;align-items:center;justify-content:center;gap:8px;
  transition:background .12s,opacity .12s;
}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-hover)}
.btn.primary:disabled{opacity:.5;cursor:default}
.alt{margin-top:14px;text-align:center;font-size:12.5px;color:var(--fg-3)}
.alt a{color:var(--accent);text-decoration:none}
.alt a:hover{text-decoration:underline}
#msg{margin-top:14px;font-size:12.5px;min-height:19px;line-height:1.6}
#msg.err{color:var(--danger)}
#msg.ok{color:var(--ok)}
.foot{margin-top:18px;text-align:center;font-size:11.5px;color:var(--fg-4);line-height:1.9}
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <div class="brand">
      <div class="brand-mark">数</div>
      <div>
        <div class="brand-name">数字员工</div>
        <div class="brand-sub">企业数字员工工作台</div>
      </div>
    </div>

    <h1>登录工作台</h1>
    <p class="sub">使用工号与密码登录。工号需已由管理员录入花名表。</p>

    <div class="field">
      <label for="emp_id">工号</label>
      <input id="emp_id" placeholder="请输入工号" autocomplete="username">
    </div>
    <div class="field">
      <label for="password">密码</label>
      <input id="password" type="password" placeholder="请输入密码" autocomplete="current-password">
    </div>

    <button class="btn primary" id="loginBtn" onclick="doLogin()">登录</button>
    <p id="msg"></p>
    <div class="alt">首次使用？<a href="javascript:void(0)" id="regBtn" onclick="doRegister()">注册新账号</a></div>
  </div>

  <div class="foot">
    <div>企业内部系统 · 数字员工工作台</div>
    <div>忘记密码请联系管理员重置</div>
  </div>
</div>

<script>
const token = localStorage.getItem("token");
if (token) location.href = "/chat";

async function post(url, data) {
  const r = await fetch(url, { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify(data) });
  return await r.json();
}
function showMsg(text, ok) {
  const m = document.getElementById("msg");
  m.textContent = text;
  m.className = ok ? "ok" : "err";
}
function enterKey(e) { if (e.key === "Enter") doLogin(); }
document.getElementById("emp_id").addEventListener("keydown", enterKey);
document.getElementById("password").addEventListener("keydown", enterKey);

async function doLogin() {
  const emp_id = document.getElementById("emp_id").value.trim();
  const password = document.getElementById("password").value;
  if (!emp_id || !password) return showMsg("请输入工号和密码", false);
  const btn = document.getElementById("loginBtn");
  btn.disabled = true; btn.textContent = "登录中…";
  try {
    const res = await post("/api/login", { emp_id, password });
    if (res.ok) {
      localStorage.setItem("token", res.token);
      localStorage.setItem("is_admin", res.is_admin ? "1" : "0");
      localStorage.setItem("emp_id", emp_id);
      location.href = "/chat";
    } else {
      showMsg(res.msg || "登录失败", false);
    }
  } catch (e) {
    showMsg("网络错误：" + e, false);
  } finally {
    btn.disabled = false; btn.textContent = "登 录";
  }
}

async function doRegister() {
  const emp_id = document.getElementById("emp_id").value.trim();
  const password = document.getElementById("password").value;
  if (!emp_id || !password) return showMsg("请输入工号和密码", false);
  const res = await post("/api/register", { emp_id, password });
  showMsg(res.msg || (res.ok ? "注册成功，请登录" : "注册失败"), res.ok);
}
</script>
</body>
</html>
